server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/identity_db
    username: ${DB_USER:openevent}
    password: ${DB_PASSWORD:openevent}
    hikari:
      maximum-pool-size: 10
  # Chỉ phát message (quên mật khẩu), không nghe queue nào.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:openevent}
    password: ${RABBITMQ_PASSWORD:openevent}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

openevent:
  security:
    public-paths:
      - POST /api/auth/**
      - GET /api/auth/google/config
  jwt:
    # Bắt buộc. Cùng giá trị với API Gateway, tối thiểu 32 byte.
    secret: ${JWT_SECRET}
    issuer: openevent-identity
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  google:
    # Để trống thì đăng nhập Google bị tắt (503).
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
  bootstrap:
    # Để trống thì không tạo tài khoản admin.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
