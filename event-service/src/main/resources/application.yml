server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/event_db
    username: ${DB_USER:openevent}
    password: ${DB_PASSWORD:openevent}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:openevent}
    password: ${RABBITMQ_PASSWORD:openevent}
    listener:
      simple:
        # Message lỗi được thử lại 3 lần rồi chuyển vào dead-letter queue, không lặp vô hạn.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

openevent:
  media:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
  security:
    public-paths:
      - GET /api/events/**
      - GET /api/categories/**
      - GET /api/venues/**
