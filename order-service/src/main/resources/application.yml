server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/order_db
    username: ${DB_USER:openevent}
    password: ${DB_PASSWORD:openevent}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:openevent}
    password: ${RABBITMQ_PASSWORD:openevent}
    listener:
      simple:
        # Message lỗi được thử lại 3 lần rồi chuyển vào dead-letter queue, không lặp vô hạn.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
    circuitbreaker:
      resilience4j:
        # Thời gian chờ do read-timeout của Feign quyết định, không dùng giới hạn 1 giây mặc định.
        disable-time-limiter: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        # Lỗi 4xx (như 409 hết vé) là kết quả nghiệp vụ, không phải service hỏng.
        ignore-exceptions:
          - feign.FeignException$FeignClientException

openevent:
  order:
    # BR-02: đơn PENDING giữ vé 10 phút; hạn đơn còn bị giới hạn bởi hạn giữ vé Ticket trả về.
    hold-for: PT10M
    # BR-02: chu kỳ (ms) của job chuyển đơn PENDING quá hạn sang EXPIRED; phải ngắn hơn 2 phút chờ của Ticket.
    expire-interval: 60000
    # KB-1 bước 7: thử lại lời gọi Identity, Event, Ticket khi lỗi mạng hoặc 5xx; 4xx không thử lại.
    remote:
      max-attempts: 3
      wait: 200ms
