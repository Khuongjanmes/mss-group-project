# Chạy toàn bộ:          docker compose up --build
# Chỉ chạy hạ tầng:      docker compose up -d postgres mongodb rabbitmq eureka-server
# Chỉ Gateway mở cổng ra ngoài. Các service tin header X-User-* nên không được mở cổng.
# Hạ tầng và Eureka chỉ mở trên 127.0.0.1 để chạy service trên máy khi phát triển.

x-service-env: &service-env
  EUREKA_URL: http://eureka-server:8761/eureka
  DB_HOST: postgres
  DB_USER: ${POSTGRES_USER:-openevent}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-openevent}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Cần đặt RABBITMQ_PASSWORD trong .env}

x-service-defaults: &service-defaults
  restart: unless-stopped
  depends_on: &service-depends
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    eureka-server:
      condition: service_healthy

x-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openevent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Kiểm tra database tạo cuối cùng để chắc chắn script khởi tạo đã chạy xong.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-openevent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Cần đặt RABBITMQ_PASSWORD trong .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  eureka-server:
    build:
      context: .
      args:
        SERVICE: eureka-server
    restart: unless-stopped
    environment:
      EUREKA_HOSTNAME: eureka-server
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8761/actuator/health"]

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]

  identity-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: identity-service
    environment:
      <<: *service-env
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/actuator/health"]

  event-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: event-service
    environment:
      <<: *service-env
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/actuator/health"]

  ticket-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: ticket-service
    environment:
      <<: *service-env
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8083/actuator/health"]

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      <<: *service-env
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8084/actuator/health"]

  payment-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      <<: *service-env
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/payments/vnpay-return}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/actuator/health"]

  notification-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: notification-service
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongodb:27017/notification_db
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8086/actuator/health"]

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
